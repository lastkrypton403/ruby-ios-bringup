name: shim
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu cpio
      - run: |
          cd shim-topaz
          MKBOOTIMG="python3 -c pass" bash build.sh || true
          ls -l out/
          test -f out/Image
      - uses: actions/upload-artifact@v4
        with:
          name: shim
          path: shim-topaz/out/Image
